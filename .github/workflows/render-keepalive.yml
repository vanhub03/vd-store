name: Render keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and Telegram bot services
        run: |
          set -euo pipefail
          for url in \
            "https://api.vanhdao.io.vn/health" \
            "https://bot.vanhdao.io.vn/health"
          do
            echo "Pinging ${url}"
            curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 8 "${url}" >/dev/null
          done
