services:
  - type: keyvalue
    name: vd-store-redis
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: vd-store-api
    runtime: node
    plan: free
    region: singapore
    domains:
      - api.vanhdao.io.vn
    buildCommand: corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @vd-store/api prisma:generate && pnpm --filter @vd-store/api build
    startCommand: corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm --filter @vd-store/api exec prisma migrate deploy && pnpm --filter @vd-store/api prisma:seed && pnpm --filter @vd-store/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: vd-store-redis
          type: keyvalue
          property: connectionString
      - key: BOT_INTERNAL_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_USERNAME
        value: vanhdao99
      - key: SEPAY_AUTH_MODE
        value: hmac
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: SEPAY_API_KEY
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: VIETQR_BANK_CODE
        sync: false
      - key: VIETQR_ACCOUNT_NUMBER
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: VIETQR_TEMPLATE
        value: compact2
      - key: VIETQR_IMAGE_BASE_URL
        value: https://img.vietqr.io/image

  - type: web
    name: vd-store-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @vd-store/bot build
    startCommand: corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm --filter @vd-store/bot start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://api.vanhdao.io.vn
      - key: BOT_INTERNAL_TOKEN
        fromService:
          name: vd-store-api
          type: web
          envVarKey: BOT_INTERNAL_TOKEN
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_PUBLIC_URL
        value: https://vd-store-bot.onrender.com
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: ADMIN_TELEGRAM_USERNAME
        value: vanhdao99

  - type: web
    name: vd-store-admin
    runtime: static
    domains:
      - admin.vanhdao.io.vn
    buildCommand: corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @vd-store/admin build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: VITE_API_BASE_URL
        value: https://api.vanhdao.io.vn
